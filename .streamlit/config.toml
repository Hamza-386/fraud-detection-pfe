# Thème du dashboard Streamlit (lu automatiquement quand
# `streamlit run dashboard/app.py` est lancé depuis la racine du projet).
[theme]
base = "dark"
primaryColor = "#3B82F6"              # bleu = modèle de production
backgroundColor = "#0F172A"
secondaryBackgroundColor = "#1E293B"
textColor = "#E2E8F0"
font = "sans serif"

[browser]
gatherUsageStats = false
