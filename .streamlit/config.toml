# Theme of the Streamlit dashboard (read automatically when
# `streamlit run dashboard/app.py` is started from the project root).
[theme]
base = "dark"
primaryColor = "#3B82F6"              # blue = production model
backgroundColor = "#0F172A"
secondaryBackgroundColor = "#1E293B"
textColor = "#E2E8F0"
font = "sans serif"

[browser]
gatherUsageStats = false
